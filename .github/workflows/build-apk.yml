name: CI/CD Automated Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1). Leave empty to use package.json version.'
        required: false
        default: ''
      release_title:
        description: 'Release Title (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build PWA & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Determine Version Tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER="v$(node -p "require('./package.json').version")"
          fi
          # Ensure 'v' prefix
          if [[ $RAW_VER != v* ]]; then
            RAW_VER="v$RAW_VER"
          fi
          CLEAN_VER="${RAW_VER#v}"
          echo "TAG_NAME=$RAW_VER" >> $GITHUB_OUTPUT
          echo "CLEAN_VERSION=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Building Vidyapath release: $RAW_VER ($CLEAN_VER)"

      - name: Run test suite
        run: npm test

      - name: Build Web PWA assets
        run: npm run build

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: |
          echo "Syncing Capacitor Android..."
          OUTPUT=$(npx @capacitor/cli sync android 2>&1) || {
            echo "::error::Capacitor Sync Failed: $OUTPUT"
            echo "=== Detailed Output ==="
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"

      - name: Build Android Debug APK
        run: |
          cd android
          BUILD_CODE=$(date +%s)
          ./gradlew assembleDebug -PversionCode=$BUILD_CODE -PversionName=${{ steps.ver.outputs.CLEAN_VERSION }} --stacktrace

      - name: Prepare Release APK Package
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/vidyapath-app.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/vidyapath-${{ steps.ver.outputs.TAG_NAME }}.apk
          ls -la release-assets/

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidyapath-${{ steps.ver.outputs.TAG_NAME }}-apk
          path: release-assets/*.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          tag_name: ${{ steps.ver.outputs.TAG_NAME }}
          name: ${{ github.event.inputs.release_title != '' && github.event.inputs.release_title || steps.ver.outputs.TAG_NAME }}
          files: |
            release-assets/vidyapath-app.apk
            release-assets/vidyapath-${{ steps.ver.outputs.TAG_NAME }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
