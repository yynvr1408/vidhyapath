name: CI Quality & Tests (PRs)

on:
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite (Answer Checker, Sync, Neon DB, Groq & Health Endpoints)
        run: npm test

      - name: Build Web PWA Bundle
        run: npm run build

      - name: Verify Capacitor Sync
        run: npx cap sync android
