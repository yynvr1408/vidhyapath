name: Web Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build Vidyapath PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run existing test suite
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: vidyapath-web-${{ github.sha }}
          path: dist/
          retention-days: 14
