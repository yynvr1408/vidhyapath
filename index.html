<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="description" content="Vidyapath - The Last-Mile Tutor for Class 10 Maths" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Vidyapath · The Last-Mile Tutor</title>
    <!-- Preload Telugu font stack -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F4F9F6] text-[#0F172A] font-telugu min-h-screen selection:bg-[#15803D] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for offline PWA capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('Vidyapath PWA ServiceWorker registered with scope:', reg.scope),
            (err) => console.log('ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
